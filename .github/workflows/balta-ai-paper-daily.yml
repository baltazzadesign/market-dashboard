name: BALTA AI daily paper research
on:
  schedule:
    # UTC 22:37 Sunday-Thursday = KST 07:37 Monday-Friday.
    - cron: "37 22 * * 0-4"
    # Retry window UTC 23:27 Sunday-Thursday = 08:27 KST (before market open).
    - cron: "27 23 * * 0-4"
    # UTC 08:17 Monday-Friday = KST 17:17 Monday-Friday.
    - cron: "17 8 * * 1-5"
    # Retry late KIS-close prices at 18:47 KST, without repeating settled outcomes.
    - cron: "47 9 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "Paper research phase"
        required: true
        type: choice
        options: [morning, close]
      trade_date:
        description: "Explicit KST target date (YYYY-MM-DD); never inferred for manual runs"
        required: true
        type: string
      dry_run:
        description: "Read-only recovery plan; uncheck only after approving DB writes"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: balta-ai-paper-research
  cancel-in-progress: false
jobs:
  paper:
    if: github.repository == 'baltazzadesign/market-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
      KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
      KIS_BASE: ${{ secrets.KIS_BASE }}
      # Only the independent FLOW_CASH_V1 needs this; missing key leaves four original strategies live.
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      MARKET_HOLIDAYS: ${{ vars.MARKET_HOLIDAYS }}
      MARKET_CALENDAR_VERIFIED_YEARS: ${{ vars.MARKET_CALENDAR_VERIFIED_YEARS || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured secrets
        id: guard
        shell: bash
        run: |
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] && [ -n "${KIS_APPKEY}" ] && [ -n "${KIS_APPSECRET}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::BALTA AI required Actions secrets missing. Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, KIS_APPKEY and KIS_APPSECRET in repository Settings."
            echo "BALTA AI research NOT executed: required secrets missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - name: Resolve immutable research target from original run metadata
        id: target
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PHASE: ${{ inputs.phase }}
          MANUAL_DATE: ${{ inputs.trade_date }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: node --import tsx scripts/balta-ai-resolve-run.ts
      - name: Run dated paper research worker
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        env:
          TARGET_PHASE: ${{ steps.target.outputs.phase }}
          TARGET_DATE: ${{ steps.target.outputs.trade_date }}
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
          BALTA_AI_SCHEDULED_AT: ${{ steps.target.outputs.scheduled_at }}
          BALTA_AI_RUN_CREATED_AT: ${{ steps.target.outputs.run_created_at }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          args=("--phase=${TARGET_PHASE}" "--date=${TARGET_DATE}")
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          node --import tsx scripts/balta-ai-research.ts "${args[@]}"
