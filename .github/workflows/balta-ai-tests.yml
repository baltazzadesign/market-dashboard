name: BALTA AI research tests
on:
  pull_request:
    paths:
      - "lib/balta-ai-model.ts"
      - "lib/balta-ai-dashboard.ts"
      - "lib/balta-ai-benchmark.ts"
      - "lib/balta-ai-flow-strategy.ts"
      - "lib/balta-ai-liquidity.ts"
      - "lib/balta-ai-regime.ts"
      - "lib/balta-ai-health.ts"
      - "lib/balta-ai-exits.ts"
      - "lib/balta-ai-stop-policy.ts"
      - "components/dashboard/AiResearchDefensiveStudy.tsx"
      - "components/dashboard/AiResearchDefensiveStudy.module.css"
      - "components/dashboard/AiResearchSimulator.tsx"
      - "components/dashboard/AiResearchSimulator.module.css"
      - "components/dashboard/AiResearchInsights.tsx"
      - "components/dashboard/AiResearchInsights.module.css"
      - "components/dashboard/AiResearchWorkspace.tsx"
      - "components/dashboard/AiResearchWorkspace.module.css"
      - "components/dashboard/TerminalHeader.tsx"
      - "app/ai-research/page.tsx"
      - "app/api/ai-research/route.ts"
      - "lib/balta-ai-evaluation.ts"
      - "lib/balta-ai-reliability.ts"
      - "scripts/balta-ai-research.ts"
      - "scripts/balta-ai-preflight.ts"
      - "scripts/balta-ai-liquidity-preflight.ts"
      - "tests/balta-ai-model.test.ts"
      - "tests/balta-ai-dashboard.test.ts"
      - "tests/balta-ai-benchmark.test.ts"
      - "tests/balta-ai-flow-strategy.test.ts"
      - "tests/balta-ai-liquidity.test.ts"
      - "tests/balta-ai-regime.test.ts"
      - "tests/balta-ai-health.test.ts"
      - "tests/balta-ai-exits.test.ts"
      - "tests/balta-ai-stop-policy.test.ts"
      - "tests/balta-ai-dashboard-api.test.ts"
      - "tests/balta-ai-evaluation.test.ts"
      - "tests/balta-ai-reliability.test.ts"
      - ".github/workflows/balta-ai-paper-daily.yml"
      - "supabase/migrations/20261014_balta_ai_research.sql"
      - "supabase/migrations/20261014_balta_ai_benchmarks.sql"
      - "supabase/migrations/20261014_balta_ai_flow_persist_v1.sql"
      - "supabase/migrations/20261014_balta_ai_liquid_v1.sql"
      - "supabase/migrations/20261014_balta_ai_exit_simulations.sql"
      - "supabase/migrations/20261014_balta_ai_stop_followups.sql"
      - ".github/workflows/balta-ai-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/balta-ai-model.test.ts tests/balta-ai-evaluation.test.ts tests/balta-ai-reliability.test.ts tests/balta-ai-dashboard.test.ts tests/balta-ai-benchmark.test.ts tests/balta-ai-flow-strategy.test.ts tests/balta-ai-liquidity.test.ts tests/balta-ai-regime.test.ts tests/balta-ai-health.test.ts tests/balta-ai-exits.test.ts tests/balta-ai-stop-policy.test.ts tests/balta-ai-dashboard-api.test.ts
      - run: npm run typecheck
      - run: npm run build
  connectivity:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
      KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read-only source and credentials check
        run: node --import tsx scripts/balta-ai-preflight.ts
      - name: Read-only KIS liquidity field contract
        run: node --import tsx scripts/balta-ai-liquidity-preflight.ts
